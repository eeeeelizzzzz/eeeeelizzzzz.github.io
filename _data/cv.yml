        - "**Role:** PI, **Status:** $1M-Funded"
    - title: Precision Landing and Auto-Charging for Weather-Sensing UAS
      institution: CIWRO Director's Discretionary Research Fund
      year: 2023 - 2025
      description:
        - Supported the proof-of-concept design for CopterSonde precision landing/auto-charging; role included conceptual design and capstone team supervision.
        - "**Role:** Collaborator, **Status:** $25.5K-Funded"
    - title: PRODIGEE-UAS
      institution: NOAA UXSRTO Research and Development
      year: 2023 - 2025
      description:
        - Advances CopterSonde UAS capabilities through R&D in hardware, autopilot functions, immediate data dissemination, and supporting software/SOPs.
        - "**Role:** PI, **Status:** $432.5K-Funded"
    - title: Venturing Into the Vertical
