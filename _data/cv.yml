- title: Research Funding
  type: time_table
  contents:
    - title: Observing the Air-Sea Transition Zone Using Coordinated UxS
      institution: NOAA CPO TPEX-Central
      year: 2025 - 2027
      description:
        - Deploys coordinated uncrewed systems (UUV, USV, UAV) to make simultaneous, collocated air-sea interface measurements.
        - "**Role:** Co-PI, **Status:** $731K-Recommended"
    - title: CopterSonde LAAIRS: Laboratory for Advanced Atmospheric Investigation using Robotic Sondes
      institution: UxSOC Breakthrough in UxS RFP
      year: 2025 - 2027
      description:
