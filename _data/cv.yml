- title: Research Funding
  type: time_table
  contents:
    - title: Observing the Air-Sea Transition Zone Using Coordinated UxS
      institution: NOAA CPO TPEX-Central
      year: 2025 - 2027
      description:
        - Deploys coordinated uncrewed systems (UUV, USV, UAV) to make simultaneous, collocated air-sea interface measurements.
        - "**Role:** Co-PI, **Status:** $731K-Recommended"
    - title: CopterSonde LAAIRS: Laboratory for Advanced Atmospheric Investigation using Robotic Sondes
      institution: UxSOC Breakthrough in UxS RFP
      year: 2025 - 2027
      description:
        - Aims to enable unattended, autonomous CopterSonde operations by developing precision landing, automated charging, remote communication, and environmental resilience.
        - "**Role:** PI, **Status:** $1M-Funded"
    - title: Precision Landing and Auto-Charging for Weather-Sensing UAS
      institution: CIWRO Director's Discretionary Research Fund
      year: 2023 - 2025
      description:
        - Supported the proof-of-concept design for CopterSonde precision landing/auto-charging; role included conceptual design and capstone team supervision.
        - "**Role:** Collaborator, **Status:** $25.5K-Funded"
    - title: PRODIGEE-UAS
      institution: NOAA UXSRTO Research and Development
      year: 2023 - 2025
      description:
        - Advances CopterSonde UAS capabilities through R&D in hardware, autopilot functions, immediate data dissemination, and supporting software/SOPs.
        - "**Role:** PI, **Status:** $432.5K-Funded"
    - title: Venturing Into the Vertical
      institution: NOAA/WPO Mesonet BL Observations
      year: 2023 - 2025
      description:
        - Performs Observing System Simulation Experiments (OSSEs) to determine the optimal design of a 3D boundary-layer profiling mesonet to fill data gaps.
        - "**Role:** Co-PI, **Status:** $600K-Funded"
    - title: American Wake Experiment (AWAKEN) - Year 2
      institution: NOAA - DOE Inter-agency Agreement
      year: 2022 - 2023
      description:
        - Led the deployment and oversight of the CLAMPS2 facility to sample flow undisturbed by turbine wakes as part of the AWAKEN campaign.
        - "**Role:** Co-PI, **Status:** $24.5K-Funded"
    - title: Deployment of CLAMPS + UAS Network-in-Network Profilers
      institution: NOAA VORTEX-USA - CLAMPS + UAS
      year: 2022 - 2024
      description:
        - Coupled ground-based profilers (CLAMPS) with UAS platforms to measure properties critical to high-impact weather in the SE US, parallel to the PERILS effort.
        - "**Role:** PI, **Status:** $80K-Funded"
    - title: Analysis and OSEs of UAS observations for improved high impact weather forecasts
      institution: NOAA/WPO - UAS and High Impact Weather
      year: 2020 - 2022
      description:
        - Deployed UAS to collect vertical profiles for analysis, assimilation into NSSL's Warn on Forecast System, and exploration with NWS forecasters.
        - "**Role:** Collaborator, **Status:** $575K-Funded"
    - title: American Wake Experiment (AWAKEN) - Year 1
      institution: NOAA - DOE Inter-agency Agreement
      year: 2020 - 2021
      description:
        - Contributed to experimental design and provided expertise on ground-based thermodynamic profiling to understand how turbine wakes affect wind farm efficiency.
        - "**Role:** Co-PI, **Status:** $12.5K-Funded"
    - title: SPLASH-SAIL and continued PBL Analyses
      institution: NOAA/OAR/OWAQ - Boundary Layer Continued Support
      year: 2021
      description:
        - Supported analysis of CHEESHEAD data and the deployment of CLAMPS2 to Crested Butte, CO, for the SPLASH-SAIL campaign to evaluate PBL evolution.
        - "**Role:** PI, **Status:** $117K-Funded"
    - title: Coastal Urban Boundary-layer Interactions with Convection (CUBIC)
      institution: DOE/OSBER/ASR - TRACER-CUBIC
      year: 2020 - 2022
      description:
        - Supported collection of high-resolution data on boundary layer processes and thermal circulation in a coastal urban region, adding value to the TRACER project.
        - "**Role:** Co-PI, **Status:** $300K-Funded"
    - title: Evaluating Polarimetric Retrievals of Boundary Layer Height...
      institution: CIMMS Director's Discretionary Research Fund
      year: 2020 - 2021
      description:
        - Supported data collection and analysis to evaluate a proposed method for boundary layer height detection from operational WSR-88D radar.
        - "**Role:** Co-PI, **Status:** $37K-Funded"
    - title: CHEESEHEAD Analysis
      institution: NOAA/OAR/OWAQ - Boundary Layer Analysis Next
      year: 2020 - 2021
      description:
        - Supported the analysis of data collected during the CHEESHEAD deployment period.
        - "**Role:** PI, **Status:** $117K-Funded"
    - title: Defining the capabilities of boundary layer profiling systems...
      institution: NOAA/OAR/OWAQ - VORTEX-SE
      year: 2019 - 2021
      description:
        - Used VORTEX-SE boundary layer profile observations to evaluate profiling platforms, inform future deployments, and assess operational forecast tools.
        - "**Role:** PI, **Status:** $300K-Funded"
    - title: CHEESEHEAD Data Collection
      institution: NOAA/OAR/OWAQ - Boundary Layer
      year: 2019
      description:
        - Supported the deployment of both CLAMPS platforms in northern Wisconsin to characterize surface conditions and the overlying atmosphere.
        - "**Role:** PI, **Status:** $142K-Funded"
