- title: Experience
  type: time_table
  contents:
    - title: Research Meteorologist
      institution: NOAA - National Severe Storms Laboratory, Norman, OK
      year: 2020 - Present
      description:
        - Specialize in atmospheric observations, including boundary-layer profilers and un-crewed aircraft systems (UAS). Develop next-generation observing networks to understand processes relevant to convection initiation and pre-storm environments.
    - title: Affiliate Assistant Professor
      institution: University of Oklahoma School of Meteorology, Norman, OK
      year: 2021 - Present
      description:
        - Mentor undergraduate research assistants and interns. Advise MS and Ph.D. students. Periodically teach, including designing and instructing an elective undergraduate/graduate level course: Advanced Observations for Lower Atmospheric Research.
    - title: Post-Doctoral Research Associate
      institution: Cooperative Institute for Mesoscale Meteorological Studies, Norman, OK
      year: 2019
      description:
        - Focused on development and deployment of NSSL boundary-layer profiling systems. Explored experimental systems for advancing understanding of severe convective weather. Considered systems to enhance the NOAA upper-air observing network.
    - title: Graduate Research Assistant
      institution: University of Oklahoma - School of Meteorology, Norman, OK
      year: 2014 - 2018
      description:
        - Researched nocturnal low-level jets and boundary layers using numerical simulation methods and meteorological observing platforms as part of the BLISS group. Served as part of the first group of CLAMPS-1 operators. Assisted in the initial development of CLAMPS-2.
    - title: NWS WFO CYS Intern
      institution: NOAA Education Hollings Intern - National Weather Service, Cheyenne, WY
      year: 2013
      description:
        - Examined the role of two-inch soil temperatures on early- and late-season snowfall accumulation. Worked with forecasters to understand forecast problems and develop trial guidance based on visibility observations. Awarded first place among Hollings cohort for research project. Assisted on the operations floor with forecasts, warnings, community decision support, and completed warning event simulations.
    - title: Meteorology Intern
      institution: WOWK Channel 13, Charleston, WV
      year: 2012
      description:
        - Prepared forecasts and weather graphics for the Charleston viewing area and a West Virginia state-wide broadcast. Operated the Emergency Alert Crawler during severe weather days. Fielded calls and social media messages from the public and ran the NWS Chat system.

